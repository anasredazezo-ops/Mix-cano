<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>اختيار طالب</title>
<style>
  :root { --blue:#29b6f6; --bg:#000; --panel:rgba(20,20,24,.78); --text:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  video { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  canvas { width:100%; height:100%; object-fit:contain; background:#000; }
  canvas.mirror { transform:scaleX(-1); }

  #status { position:fixed; top:calc(env(safe-area-inset-top) + 12px); left:50%; transform:translateX(-50%);
    background:var(--panel); padding:8px 16px; border-radius:999px; font-size:15px; backdrop-filter:blur(8px);
    max-width:90%; text-align:center; transition:opacity .3s; }
  #status.hide { opacity:0; }

  #controls { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 18px);
    display:flex; gap:10px; justify-content:center; align-items:center; padding:0 14px; flex-wrap:wrap; }
  button { font:inherit; border:0; color:#fff; background:var(--panel); padding:14px 20px; border-radius:16px;
    font-size:17px; backdrop-filter:blur(8px); cursor:pointer; min-height:52px; }
  button:active { transform:scale(.96); }
  button.primary { background:var(--blue); color:#00131c; font-weight:700; font-size:20px; padding:14px 34px; }
  button:disabled { opacity:.45; }
  .hidden { display:none !important; }

  #top { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:12px; display:flex; gap:8px; }
  #top button { padding:10px 14px; min-height:44px; font-size:15px; }

  #splash { position:fixed; inset:0; background:#0b0f14; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; z-index:10; }
  #splash h1 { margin:0; font-size:26px; }
  #splash p { margin:0; color:#aab4bf; line-height:1.7; max-width:420px; }
</style>
</head>
<body>

<div id="splash">
  <h1>🎯 اختيار طالب بالسبورة الذكية</h1>
  <p>يفتح الكاميرا، يكتشف الوجوه، ثم يختار طالبًا عشوائيًا ويعمل عليه زوم.</p>
  <button class="primary" id="btnOpen">فتح الكاميرا</button>
  <p id="splashMsg"></p>
</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
</div>

<div id="status" class="hide"></div>

<div id="top" class="hidden">
  <button id="btnSwitch">🔄 تبديل الكاميرا</button>
  <button id="btnBoxes">👁 إظهار الوجوه</button>
</div>

<div id="controls" class="hidden">
  <button class="primary" id="btnStart">ابدأ</button>
  <button id="btnAgain" class="hidden">🎲 اختيار آخر</button>
  <button id="btnReset" class="hidden">إلغاء الزوم</button>
</div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const statusEl = $("status");

let detector = null;
let stream = null;
let facing = "environment";
let showBoxes = false;

let faces = [];              // الوجوه المكتشفة {cx, cy, w, h}
let mode = "idle";           // idle | shuffling | selected
let selected = null;         // الوجه المختار
let lostFrames = 0;
let shuffleHighlight = null;
let lastDetect = 0;
let statusTimer = null;

let view = { x:0, y:0, w:1, h:1 };       // المنطقة المعروضة حاليًا
let targetView = { x:0, y:0, w:1, h:1 };

function say(msg, ms = 2500) {
  statusEl.textContent = msg;
  statusEl.classList.remove("hide");
  clearTimeout(statusTimer);
  if (ms) statusTimer = setTimeout(() => statusEl.classList.add("hide"), ms);
}

async function loadDetector() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const opts = (delegate) => ({
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
      delegate
    },
    runningMode: "VIDEO",
    minDetectionConfidence: 0.35
  });
  try { detector = await FaceDetector.createFromOptions(fileset, opts("GPU")); }
  catch { detector = await FaceDetector.createFromOptions(fileset, opts("CPU")); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
  });
  video.srcObject = stream;
  await video.play();
  await new Promise(r => { if (video.videoWidth) r(); else video.onloadedmetadata = r; });
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.classList.toggle("mirror", facing === "user");
  view = { x:0, y:0, w:video.videoWidth, h:video.videoHeight };
  targetView = { ...view };
}

$("btnOpen").onclick = async () => {
  const msg = $("splashMsg");
  $("btnOpen").disabled = true;
  try {
    msg.textContent = "جارٍ تشغيل الكاميرا…";
    await startCamera();
    msg.textContent = "جارٍ تحميل نموذج كشف الوجوه… (يحتاج إنترنت أول مرة)";
    await loadDetector();
    $("splash").classList.add("hidden");
    $("top").classList.remove("hidden");
    $("controls").classList.remove("hidden");
    say("وجّه الكاميرا نحو الطلاب ثم اضغط «ابدأ»", 4000);
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    msg.textContent = "تعذّر التشغيل: " + (e.message || e) + " — تأكد من السماح بالكاميرا ومن اتصال الإنترنت.";
    $("btnOpen").disabled = false;
  }
};

$("btnSwitch").onclick = async () => {
  facing = facing === "environment" ? "user" : "environment";
  try { await startCamera(); resetZoom(); } catch (e) { say("تعذّر تبديل الكاميرا"); }
};

$("btnBoxes").onclick = () => {
  showBoxes = !showBoxes;
  $("btnBoxes").textContent = showBoxes ? "🙈 إخفاء الوجوه" : "👁 إظهار الوجوه";
};

function detect(now) {
  if (!detector || now - lastDetect < 90) return;
  lastDetect = now;
  const res = detector.detectForVideo(video, now);
  faces = res.detections.map(d => {
    const b = d.boundingBox;
    return { cx: b.originX + b.width / 2, cy: b.originY + b.height / 2, w: b.width, h: b.height };
  });
  // تتبّع الطالب المختار أثناء حركته
  if (mode === "selected" && selected) {
    let best = null, bd = Infinity;
    for (const f of faces) {
      const d = Math.hypot(f.cx - selected.cx, f.cy - selected.cy);
      if (d < bd) { bd = d; best = f; }
    }
    if (best && bd < Math.max(selected.w, selected.h) * 1.8) {
      selected = best; lostFrames = 0;
    } else lostFrames++;
    updateZoomTarget();
  }
}

function updateZoomTarget() {
  const vw = video.videoWidth, vh = video.videoHeight;
  let h = Math.max(selected.h * 4.5, vh / 6);
  h = Math.min(h, vh);
  let w = h * vw / vh;
  let x = selected.cx - w / 2, y = selected.cy - h / 2;
  x = Math.max(0, Math.min(vw - w, x));
  y = Math.max(0, Math.min(vh - h, y));
  targetView = { x, y, w, h };
}

function resetZoom() {
  mode = "idle"; selected = null;
  targetView = { x:0, y:0, w:video.videoWidth, h:video.videoHeight };
  $("btnStart").classList.remove("hidden");
  $("btnAgain").classList.add("hidden");
  $("btnReset").classList.add("hidden");
}

function pickRandom(exclude) {
  let pool = faces;
  if (exclude && faces.length > 1) {
    const filtered = faces.filter(f => Math.hypot(f.cx - exclude.cx, f.cy - exclude.cy) > Math.max(exclude.w, exclude.h) * 0.8);
    if (filtered.length) pool = filtered;
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

async function startPicking(isAgain = false) {
  if (mode === "shuffling") return;
  const prev = selected;
  if (!faces.length) { say("لم أجد وجوهًا. قرّب الكاميرا أو حسّن الإضاءة"); return; }
  mode = "shuffling";
  targetView = { x:0, y:0, w:video.videoWidth, h:video.videoHeight };
  $("btnStart").disabled = true; $("btnAgain").disabled = true;
  say("جارٍ الاختيار…", 0);

  const end = performance.now() + 2200;
  let delay = 90;
  while (performance.now() < end) {
    shuffleHighlight = faces.length ? faces[Math.floor(Math.random() * faces.length)] : null;
    await new Promise(r => setTimeout(r, delay));
    delay += 12;
  }
  shuffleHighlight = null;

  if (!faces.length) {
    mode = "idle"; say("اختفت الوجوه، حاول مرة أخرى");
  } else {
    selected = pickRandom(prev);
    lostFrames = 0;
    mode = "selected";
    updateZoomTarget();
    say("تم اختيار الطالب 🎉", 2500);
    $("btnStart").classList.add("hidden");
    $("btnAgain").classList.remove("hidden");
    $("btnReset").classList.remove("hidden");
  }
  $("btnStart").disabled = false; $("btnAgain").disabled = false;
}

$("btnStart").onclick = () => startPicking(false);
$("btnAgain").onclick = () => startPicking(true);
$("btnReset").onclick = () => { resetZoom(); say("عاد العرض الكامل"); };

function circle(f, color, width, glow) {
  const s = canvas.width / view.w;
  const x = (f.cx - view.x) * s, y = (f.cy - view.y) * s;
  const r = Math.max(f.w, f.h) * 0.8 * s;
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.lineWidth = width; ctx.strokeStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 24; }
  ctx.stroke(); ctx.restore();
}

function loop(now) {
  if (video.readyState >= 2) {
    detect(now);

    // حركة ناعمة للزوم
    const k = 0.12;
    view.x += (targetView.x - view.x) * k;
    view.y += (targetView.y - view.y) * k;
    view.w += (targetView.w - view.w) * k;
    view.h += (targetView.h - view.h) * k;

    ctx.drawImage(video, view.x, view.y, view.w, view.h, 0, 0, canvas.width, canvas.height);

    if (showBoxes && mode !== "selected") {
      for (const f of faces) circle(f, "rgba(255,255,255,.6)", 3, false);
    }
    if (mode === "shuffling" && shuffleHighlight) circle(shuffleHighlight, "#29b6f6", 6, true);
    if (mode === "selected" && selected && lostFrames < 20) circle(selected, "#29b6f6", 7, true);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
